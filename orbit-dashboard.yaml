            status2: sensor.wiser_lts_humidity_lounge
            button1: light.lounge_table_light
            button1_on_color: state-light-active-color
            button1_off_color: ""
            button2: light.lounge_extension_lights
            button2_on_color: light
            button2_off_color: ""
            button3: light.lounge_lamps
            button3_on_color: state-light-active-color
            curve_button1: binary_sensor.lounge_contact_sensor_door
            curve_button2: binary_sensor.lounge_motion_sensor_occupancy
            curve_button2_icon_on: orbit:motion_detected.svg
            curve_button2_icon_off: orbit:motion_off.svg
            curve_button3: cover.lounge_window_shade
            curve_button2_icon_source: custom
            curve_button3_icon_on: orbit:shutter-opening.svg
