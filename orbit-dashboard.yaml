            icon: mdi:clock-alert
            button_type: name
            card_layout: normal
            popup_mode: centered
            full_width_on_mobile: true
            cards:
              - type: custom:auto-entities
                card:
                  type: grid
                  columns: 1
                  square: false
                card_param: cards
                filter:
                  template: |
                    {% set stale =
                      state_attr('sensor.stale_entities', 'entities')
                      | default([], true)
                    %}
                    {% if stale is string %}
                      {% set stale = stale | from_json %}
                    {% endif %}
                    {% set ns = namespace(cards=[]) %}
                    {% for item in stale %}
                      {% set ns.cards = ns.cards + [{
                        'entity': item.entity_id,
                        'type': 'custom:bubble-card',
                        'card_type': 'button',
                        'button_type': 'state',
                        'show_attribute': false,
                        'show_last_changed': true,
                        'show_state': true
                      }] %}
                    {% endfor %}
                    {{ ns.cards }}
                show_empty: true
