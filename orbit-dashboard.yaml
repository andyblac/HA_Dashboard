views:
  - type: sections
    title: Home
    icon: mdi:home-circle
    path: home
    max_columns: 3
    header:
      layout: center
      badges_position: top
      badges_wrap: wrap
    sections:
      - type: grid
        cards:
          - type: custom:weather-forecast-card
            entity: weather.home
            show_current: true
            show_forecast: true
            default_forecast: daily
            tap_action:
              action: more-info
            show_condition_effects:
              - rain
              - snow
              - lightning
              - sky
              - moon
              - sun
            forecast_types: both
            show_moon_phase: true
            forecast:
              mode: chart
              show_sun_times: true
              use_color_thresholds: true
              scroll_to_selected: true
              show_attribute_selector: true
              default_chart_attribute: temperature_and_precipitation
              extra_attribute: wind_bearing
            forecast_action:
              tap_action:
                action: toggle-forecast
              hold_action:
                action: select-forecast-attribute
            card_mod:
              style: |
                ha-card {
                  padding-left: 0px !important;
                  padding-right: 8px !important;
                }
          - type: custom:orbit-deck-card
            layout: wrap
            items_per_row: 2
            separate_cards: true
            decks:
              - attributes: {}
                card:
                  type: custom:orbit-status-card
                  mode: person
                  main_entity: person.example_user
                  tracker_entity: device_tracker.example_phone
                  battery_entity_1: sensor.example_phone_battery_level
              - attributes: {}
                card:
                  type: custom:orbit-action-card
                  entities:
                    - entity: script.evening
                      accent_color: orange
                    - entity: script.uk_streaming_actions_mr
                      accent_color: yellow
                    - entity: script.us_streaming_actions_mr
                      accent_color: violet
              - attributes: {}
                card:
                  type: custom:orbit-status-card
                  main_entity: sensor.security_state
                  tap_action:
                    action: navigate
                    navigation_path: "#security"
                  main_entity_tap_action:
                    action: more-info
              - attributes: {}
                card:
                  type: custom:orbit-status-card
                  entity: sensor.heating_state
                  main_entity: sensor.heating_state
            grid_options:
              columns: full
          - type: custom:orbit-status-card
            mode: icon_only
            wrap: true
            items_per_row: 6
            separate_cards: true
            entities:
              - entity: sensor.unavailable_entities
                accent_on_color: red
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#unavailable-entities"
              - entity: sensor.devices_with_low_battery
                accent_on_color: blue
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#batteries"
              - entity: sensor.number_of_doors_open
                accent_on_color: blue
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#doors-open"
              - entity: sensor.number_of_sockets_on
                accent_on_color: blue
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#sockets-on"
              - entity: sensor.number_of_motion_detected
                accent_on_color: blue
                main_entity_icon_on: orbit:motion_detected.svg
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#motion-detected"
              - entity: sensor.number_of_lights_on
                accent_on_color: light
                main_entity_tap_action:
                  action: navigate
                  navigation_path: "#lights-on"
              - entity: sensor.recycle_collection
                accent_on_color: blue
                state_template: state_attr('sensor.recycle_collection', 'daysTo') | int <2
                label_template: state_attr('sensor.recycle_collection', 'daysTo')
              - entity: sensor.rubbish_collection
                accent_on_color: green
                state_template: state_attr('sensor.rubbish_collection', 'daysTo') | int <2
                label_template: state_attr('sensor.rubbish_collection', 'daysTo')
              - entity: sensor.cleaner_due
                accent_on_color: green
                label_template: state_attr('sensor.cleaner_due', 'daysTo')
              - entity: calendar.example_hot_water
                accent_on_color: green
              - entity: sensor.backup_backup_manager_state
                accent_on_color: green
                main_entity_icon: mdi:database
                label_template: "0"
          - type: custom:orbit-deck-card
            layout: wrap
            items_per_row: 4
            decks:
              - attributes:
                  tap_action:
                    action: navigate
                    navigation_path: "#energy"
                  hold_action:
                    action: navigate
                    navigation_path: /power-usage/2
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: custom:gauge-card-pro
                  entity: sensor.main_import_power
                  segments:
                    - from: 0
                      color: var(--green-color)
                    - from: 400
                      color: "#FFA500"
                    - from: 900
                      color: var(--red-color)
                  needle: false
                  gradient: true
                  titles:
                    primary:
                      value: Electric
                  gradient_resolution: auto
                  max: 3000
                  min: 0
                  round: small
                  gradient_background: true
                  gradient_background_opacity: 0.4
                  severity_centered: false
                  severity_color_mode: gradient
                  value_texts:
                    primary:
                      unit_before_value: false
                      value: >-
                        {% set power = states('sensor.main_import_power') %} {{
                        power | float | round(0) if is_number(power) else '-' }}
              - attributes:
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: custom:gauge-card-pro
                  entity: sensor.relative_mod_level_boiler_otgw
                  segments:
                    - from: 0
                      color: var(--green-color)
                    - from: 50
                      color: "#FFA500"
                    - from: 75
                      color: var(--red-color)
                  needle: false
                  gradient: true
                  titles:
                    primary:
                      value: Boiler
                  gradient_resolution: auto
                  max: 100
                  min: 0
                  round: small
                  gradient_background: true
                  gradient_background_opacity: 0.4
                  severity_centered: false
                  severity_color_mode: gradient
                  value_texts:
                    primary: {}
              - attributes:
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: custom:gauge-card-pro
                  entity: >-
                    sensor.octopus_energy_electricity_22j0006288_1591022098690_current_accumulative_consumption
                  segments:
                    - from: 0
                      color: var(--green-color)
                    - from: 5
                      color: "#FFA500"
                    - from: 5.5
                      color: var(--red-color)
                  needle: false
                  gradient: true
                  titles:
                    primary:
                      value: Electric
                  gradient_resolution: auto
                  max: 8
                  min: 0
                  round: small
                  gradient_background: true
                  gradient_background_opacity: 0.4
                  severity_centered: false
                  severity_color_mode: gradient
                  value_texts:
                    primary:
                      unit_before_value: false
                      value: >-
                        {% set electric =
                        states('sensor.octopus_energy_electricity_22j0006288_1591022098690_current_accumulative_consumption')
                        %} {{ electric | float | round(1) if is_number(electric)
                        else '-' }}
              - attributes:
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: custom:gauge-card-pro
                  entity: >-
                    sensor.octopus_energy_gas_e6f23377622200_1354260601_current_accumulative_consumption
                  segments:
                    - from: 0
                      color: var(--green-color)
                    - from: 45
                      color: "#FFA500"
                    - from: 70
                      color: var(--red-color)
                  needle: false
                  gradient: true
                  titles:
                    primary:
                      value: GAS
                  gradient_resolution: auto
                  max: 80
                  min: 0
                  round: small
                  gradient_background: true
                  gradient_background_opacity: 0.4
                  severity_centered: false
                  severity_color_mode: gradient
                  value_texts:
                    primary:
                      unit_before_value: false
                      value: >-
                        {% set gas =
                        states('sensor.octopus_energy_gas_e6f23377622200_1354260601_current_accumulative_consumption')
                        %} {{ gas | float | round(1) if is_number(gas) else '-'
                        }}
              - attributes:
                  tap_action:
                    action: more-info
                    entity: sensor.system_monitor_processor_temperature
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: gauge
                  name: CPU
                  entity: sensor.system_monitor_processor_temperature
                  needle: false
                  severity:
                    green: 25
                    yellow: 50
                    red: 75
              - attributes:
                  tap_action:
                    action: more-info
                    entity: sensor.system_monitor_processor_use
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: gauge
                  name: CPU
                  entity: sensor.system_monitor_processor_use
                  needle: false
                  severity:
                    green: 25
                    yellow: 50
                    red: 75
              - attributes:
                  tap_action:
                    action: more-info
                    entity: sensor.cyberpower1500_battery_charge
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: gauge
                  name: UPS Battery
                  entity: sensor.cyberpower1500_battery_charge
                  needle: false
                  min: 0
                  max: 100
                  severity:
                    green: 100
                    yellow: 50
                    red: 0
              - attributes:
                  tap_action:
                    action: more-info
                    entity: sensor.cyberpower1500_battery_runtime
                  padding_top: "5"
                  padding_right: "0"
                  padding_bottom: "0"
                  padding_left: "0"
                card:
                  type: gauge
                  name: UPS Time
                  entity: sensor.cyberpower1500_battery_runtime
                  needle: false
                  severity:
                    green: 75
                    yellow: 50
                    red: 15
            grid_options:
              columns: full
        column_span: 1
      - type: grid
        cards:
          - type: custom:calendar-card-pro
            entities:
              - entity: calendar.example_home
              - entity: calendar.example_cleaner
              - entity: calendar.example_payments
                accent_color: "#bd9d75"
            days_to_show: 30
            compact_events_to_show: 4
            title_font_size: 14pt
            vertical_line_width: 3px
            day_spacing: 3px
            event_spacing: 5px
            additional_card_spacing: "-7px"
            first_day_of_week: monday
            month_separator_width: 3px
            month_separator_color: "#03a9f4"
            today_indicator: glow
            event_background_opacity: 10
            show_past_events: true
            show_countdown: true
            show_progress_bar: true
            event_font_size: 16px
            show_single_allday_time: false
            time_font_size: 14px
            time_icon_size: 16px
            day_font_size: 24px
            weather:
              position: ""
            tap_action:
              action: expand
          - type: custom:statistics-graph-chart-card
            card_padding: 0
            card_border_width: 0
            show_y_axis: false
            show_interval_picker: true
            interval_picker_position: center
            interval_options:
              - 4H
              - 8H
              - 12H
              - 24H
            hours_to_show: 12
            points_per_hour: 6
            tooltip_match_axis: false
            tooltip_order: default
            height: auto
            x_grid_style: dashed
            y_grid_style: dashed
            entities:
              - entity: sensor.main_import_power
                line_width: 1.5
                color: "#b1dd8c"
                color_thresholds:
                  enabled: true
                  values:
                    - value: 0
                      color: "#cce8b5"
                    - value: 250
                      color: "#96d35f"
                    - value: 500
                      color: "#fe985f"
                    - value: 750
                      color: "#ff8c2a"
                    - value: 900
                      color: "#ff4757"
                rise_fall_colors:
                  enabled: false
                  increase: "#2ecc71"
                  decrease: "#e74c3c"
                  stable: "#95a5a6"
                show_color_dot: false
                state_size: "18"
                hide_name: true
            annotations: []
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: rgb(255, 153, 102)
            area: electric_cupboard
            tap_action:
              action: navigate
              navigation_path: /dashboard-energy
            status1: sensor.main_import_power
            status1_decimal_places: "0"
            status2: sensor.electric_cupboard_sensor_temperature
            status2_decimal_places: "0"
            status3: sensor.electric_cupboard_sensor_humidity
            status3_decimal_places: "0"
            button1: light.electric_cupboard_light
            curve_buttons_lock_position: true
            curve_button1: binary_sensor.electric_cupboard_contact_sensor_door
            curve_button5: >-
              sensor.octopus_energy_electricity_22j0006288_1591022098690_current_demand
            curve_button5_tap_action:
              action: navigate
              navigation_path: /power-usage/0
            curve_button6: >-
              sensor.octopus_energy_electricity_22j0006288_1591022098690_current_accumulative_consumption
            curve_button6_tap_action:
              action: navigate
              navigation_path: /power-usage/1
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: green
            area: front_garden
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/front-garden
            button1: light.front_garden_wall_led
            button1_on_color: light
            button2: light.house_sign
            curve_button1: binary_sensor.front_door_contact_sensor
            curve_button2: binary_sensor.front_door_video_doorbell_person
            curve_button2_icon_on: orbit:motion_detected.svg
            curve_button2_icon_off: orbit:motion_off.svg
            curve_button3: binary_sensor.front_side_gate_contact_sensor
            action_button: camera.front_door_video_doorbell_clear
            grid_options:
              columns: 6
              rows: auto
            custom1: camera.front_door_video_doorbell_fluent
          - type: custom:orbit-area-card
            accent_color: green
            area: back_garden
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/back-garden
            status1: sensor.back_garden_temperature_sensor_temperature
            status2: sensor.back_garden_temperature_sensor_humidity
            button1: light.outside_roof_lights
            button1_on_color: light
            curve_button1: binary_sensor.back_door_contact_sensor
            curve_button2: binary_sensor.back_door_video_doorbell_person
            curve_button2_icon_on: orbit:motion_detected.svg
            curve_button2_icon_off: orbit:motion_off.svg
            curve_button3: binary_sensor.back_side_gate_contact_sensor
            action_button: camera.back_door_video_doorbell_clear
            grid_options:
