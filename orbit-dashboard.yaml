            curve_button3: cover.media_room_window_shade
            curve_button2_icon_source: custom
            curve_button3_icon_on: orbit:shutter-opening.svg
            curve_button3_icon_off: orbit:shutter-closing.svg
            curve_button4: switch.media_room_sofa_outlet
            curve_button4_tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: blue
            area: hall
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/hall
            status1: sensor.hall_motion_sensor_device_temperature
            button1: light.hall_lights
            button1_on_color: state-light-daylight-color
