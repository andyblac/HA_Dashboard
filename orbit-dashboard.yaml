            area: bathroom
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/wetroom
            main_entity: binary_sensor.slave_dhw_active_boiler_otgw
            main_entity_icon_on: orbit:shower_on.svg
            main_entity_icon_off: orbit:shower_off.svg
            main_entity_tap_action:
              action: none
            main_entity_hold_action:
              action: more-info
            status1: sensor.wetroom_sensor_temperature
            status1_decimal_places: "1"
            status2: sensor.wetroom_sensor_humidity
            status2_decimal_places: "0"
            status3: sensor.dhw_setpoint_boiler_otgw
            status3_decimal_places: "0"
            button1: light.wetroom_lights
            button1_on_color: state-light-daylight-color
            button2: fan.wetroom_extractor_fan
            button2_on_color: rgb(77, 195, 255)
            button2_icon_on: orbit:fan.svg
            button2_icon_off: mdi:fan
            button2_state_template: state_attr('fan.wetroom_extractor_fan', 'percentage') | int > 50
            button2_tap_action:
              action: more-info
            curve_buttons_lock_position: true
            curve_button1: input_boolean.hot_water_toggle
            curve_button1_tap_action:
              action: toggle
            curve_button3: button.hot_water_low
            curve_button3_tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.hot_water_low
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: gold
            area: office
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/office
            main_entity: climate.office_heating
            main_entity_icon_source: area
            main_entity_tap_action:
              action: none
            main_entity_hold_action:
              action: more-info
            status1: sensor.wiser_lts_temperature_office
            status2: sensor.wiser_lts_humidity_office
            button1: light.office_lights
            button1_on_color: state-light-daylight-color
            curve_buttons_lock_position: true
            curve_button1: binary_sensor.office_contact_sensor_door
            curve_button2: cover.office_window_shade
            curve_button2_icon_source: custom
            curve_button2_icon_on: orbit:shutter-opening.svg
            curve_button2_icon_off: orbit:shutter-closing.svg
            curve_button4: switch.office_sockets_1_left
