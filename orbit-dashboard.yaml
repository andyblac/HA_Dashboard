            curve_button4_icon_off: orbit:shutter-closing.svg
            curve_button5: switch.lounge_sockets_4_left
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: yellow
            area: media_room
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/media-room
            main_entity: climate.media_room_heating
            main_entity_icon_source: area
            main_entity_tap_action:
              action: none
            main_entity_hold_action:
              action: more-info
            status1: sensor.wiser_lts_temperature_media_room
            status2: sensor.wiser_lts_humidity_media_room
            button1: light.media_room_lights
            button1_on_color: state-light-daylight-color
            button2: light.media_room_sideboard_lamps
            button2_on_color: light
            curve_button1: binary_sensor.media_room_contact_sensor_door
            curve_button2: binary_sensor.media_room_motion_sensor_occupancy
            curve_button2_icon_on: orbit:motion_detected.svg
