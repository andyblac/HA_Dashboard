    sections:
      - type: grid
        cards:
          - type: custom:orbit-deck-card
            layout: tabs
            decks:
              - attributes:
                  name: Temperature
                card:
                  type: custom:statistics-graph-chart-card
                  card_padding: 0
                  card_border_width: 0
                  show_tooltip_total: false
                  show_interval_picker: true
                  interval_options:
                    - 1H
                    - 2H
                    - 4H
                    - 8H
                    - 12H
                    - 24H
                    - 3D
                    - 7D
                  points_per_hour: 6
                  tooltip_match_axis: false
                  tooltip_order: default
                  height: 185
                  show_full_period: true
                  x_grid_style: dashed
                  y_grid_style: dashed
                  entities:
                    - entity: sensor.back_garden_temperature_sensor_temperature
                      color: "#c0392b"
                      line_width: 1.5
                      decimals: 2
                      aggregate_func: last
                      rise_fall_colors:
                        enabled: false
                        increase: "#2ecc71"
                        decrease: "#e74c3c"
                        stable: "#95a5a6"
                      color_thresholds:
                        enabled: true
                        values:
                          - value: sensor.outside_seasonal_thresholds.cold
                            color: sensor.outside_seasonal_thresholds.temp_color_cold
                          - value: sensor.outside_seasonal_thresholds.ideal
                            color: >-
                              sensor.outside_seasonal_thresholds.temp_color_ideal
                          - value: sensor.outside_seasonal_thresholds.warm
                            color: sensor.outside_seasonal_thresholds.temp_color_warm
                      state_size: "18"
                      show_color_dot: false
                      hide_name: true
                  annotations: []
              - attributes:
                  name: Humidity
                card:
                  type: custom:statistics-graph-chart-card
                  card_padding: 0
                  card_border_width: 0
                  show_interval_picker: true
                  interval_options:
                    - 4H
                    - 8H
                    - 12H
                    - 24H
                    - 3D
                    - 7D
                    - 14D
                    - 30D
                  points_per_hour: 4
                  tooltip_match_axis: false
                  tooltip_order: default
                  height: 185
                  show_full_period: true
                  x_grid_style: dashed
                  y_grid_style: dashed
                  entities:
                    - entity: sensor.back_garden_temperature_sensor_humidity
                      rise_fall_colors:
                        enabled: false
                        increase: "#2ecc71"
                        decrease: "#e74c3c"
                        stable: "#95a5a6"
                      color_thresholds:
                        enabled: true
                        values:
                          - value: sensor.outside_seasonal_thresholds.humidity_dry
                            color: >-
                              sensor.outside_seasonal_thresholds.humidity_color_dry
                          - value: sensor.outside_seasonal_thresholds.humidity_ideal
                            color: >-
                              sensor.outside_seasonal_thresholds.humidity_color_ideal
                          - value: sensor.outside_seasonal_thresholds.humidity_humid
                            color: >-
                              sensor.outside_seasonal_thresholds.humidity_color_humid
                      color: "#2ecc71"
                      line_width: 1.5
                      state_size: "18"
                      show_color_dot: false
                      decimals: 2
                      aggregate_func: last
                      hide_name: true
                  annotations: []
              - attributes:
                  name: Soil Humidity
                card:
                  type: custom:statistics-graph-chart-card
                  card_padding: 0
                  card_border_width: 0
                  show_interval_picker: true
                  interval_options:
                    - 24H
                    - 3D
                    - 7D
                    - 14D
                    - 30D
                  points_per_hour: 1
                  tooltip_match_axis: false
                  tooltip_order: default
                  height: 185
                  show_full_period: true
                  x_grid_style: dashed
                  y_grid_style: dashed
                  entities:
                    - entity: sensor.back_garden_cuphea_soil_moisture
                      statistic_id: null
                      name: Cuphea
                      line_width: 1.5
                      state_size: 18px
                      aggregate_func: last
                      color_thresholds:
                        enabled: true
                        values:
                          - value: sensor.cuphea_soil_moisture_thresholds.wet
                            color: sensor.cuphea_soil_moisture_thresholds.color_wet
                          - value: sensor.cuphea_soil_moisture_thresholds.ideal
                            color: sensor.cuphea_soil_moisture_thresholds.color_ideal
                          - value: sensor.cuphea_soil_moisture_thresholds.dry
                            color: sensor.cuphea_soil_moisture_thresholds.color_dry
                      state_adaptive_color: true
                      show_color_dot: false
                      hide_name: true
                    - entity: sensor.back_garden_poppy_soil_moisture
                      statistic_id: null
                      name: Poppy
                      line_width: 1.5
                      state_size: 18px
                      aggregate_func: last
                      align_state: center
                      color_thresholds:
                        enabled: true
                        values:
                          - value: sensor.poppy_soil_moisture_thresholds.wet
                            color: sensor.poppy_soil_moisture_thresholds.color_wet
                          - value: sensor.poppy_soil_moisture_thresholds.ideal
