            main_entity_hold_action:
              action: more-info
            button1: light.garage_lights
            button1_on_color: state-light-warm-color
            button2: light.garage_wall_lights
            button2_on_color: light
            button3: light.garage_number_sign
            curve_buttons_lock_position: true
            curve_button1: binary_sensor.garage_door_contact_sensor
            curve_button2: binary_sensor.garage_motion_sensor_occupancy
            curve_button2_icon_on: orbit:motion_detected.svg
            curve_button2_icon_off: orbit:motion_off.svg
            curve_button6: switch.garage_roller_door_switch
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: red
            area: kitchen
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/kitchen
            status1: sensor.wiser_lts_temperature_kitchen
            status1_icon: ""
            status1_decimal_places: "0"
            status2: sensor.kitchen_neff_refrigerator_sensor_temperature
            status2_decimal_places: "0"
            status3: sensor.kitchen_neff_freezer_sensor_temperature
            status3_decimal_places: "0"
            button1: light.kitchen_lights
            button1_on_color: state-light-daylight-color
            button2: light.kitchen_cabinets
            button2_on_color: light
            button3: light.kitchen_floor_led
            button3_on_color: light
            curve_button1: binary_sensor.kitchen_contact_sensor_door
            curve_button1_tap_action:
              action: more-info
            curve_button2: binary_sensor.kitchen_motion_sensor_occupancy
            curve_button2_icon_on: orbit:motion_detected.svg
            curve_button2_icon_off: orbit:motion_off.svg
            curve_button3: cover.kitchen_window_shade
            curve_button3_icon_source: custom
            curve_button3_icon_on: orbit:shutter-opening.svg
            curve_button3_icon_off: orbit:shutter-closing.svg
            curve_button4: switch.kitchen_sockets_4_left
            curve_button5: switch.kitchen_sockets_2_left
            curve_button6: switch.kitchen_washing_machine_plug_outlet
            curve_button6_icon_on: orbit:washing-machine-running.svg
            curve_button6_icon_off: mdi:washing-machine
            curve_button6_state_template: states('sensor.kitchen_washing_machine_power') | int > 0
            grid_options:
              columns: 6
              rows: auto
          - type: custom:orbit-area-card
            accent_color: yellow
            area: lounge
            navigate:
              navigation_path: /dashboard-main/lounge
            main_entity: climate.lounge_heating
            main_entity_icon_source: area
